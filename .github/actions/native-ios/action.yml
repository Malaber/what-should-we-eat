name: Run native iOS shard
description: Run a selected UI shard and retain its XCTest result and diagnostics.
inputs:
  profile:
    description: Simulator profile used for artifact names.
    required: true
  device:
    description: CoreSimulator device type.
    required: true
  shard:
    description: Numbered shard or comma-separated Duo test cases.
    required: true
  capture:
    description: Export and upload marketing captures from this passing shard.
    default: 'false'
outputs:
  captures:
    description: Whether verified captures were uploaded.
    value: ${{ steps.captures.outputs.available }}
runs:
  using: composite
  steps:
  - uses: actions/setup-python@v5
    with:
      python-version: '3.14'
  - name: Verify matching Xcode build
    shell: bash
    run: python3 execution/check_ios_build_environment.py --xcode-only
  - name: Prepare the 27.2 simulator runtime for this device
    env:
      SIMULATOR_DEVICE_TYPE: ${{ inputs.device }}
    shell: bash
    run: python3 ios/Onionary/Scripts/ensure_ios_runtimes.py --device-type "$SIMULATOR_DEVICE_TYPE"
  - uses: actions/download-artifact@v4
    with:
      name: onionary-ios-test-products
      path: ${{ runner.temp }}
  - name: Run UI tests on the pinned simulator
    env:
      TEST_RESULTS_DIR: ${{ runner.temp }}/onionary-tests
      SIMULATOR_DEVICE_TYPE: ${{ inputs.device }}
      SIMULATOR_TEST_SHARD: ${{ inputs.shard }}
    shell: bash
    run: |
      mkdir -p "$TEST_RESULTS_DIR/DerivedData"
      tar -xzf "$RUNNER_TEMP/onionary-test-products.tar.gz" -C "$TEST_RESULTS_DIR/DerivedData"
      bash ios/Onionary/Scripts/test.sh --test-only
  - name: Preserve simulator test diagnostics
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: onionary-ios-test-results-${{ inputs.profile }}-${{ inputs.shard }}
      path: |
        ${{ runner.temp }}/onionary-tests/Onionary.xcresult
        ${{ runner.temp }}/onionary-tests/*.log
        ${{ runner.temp }}/onionary-tests/duo/
        ${{ runner.temp }}/onionary-tests/host-diagnostics/
      if-no-files-found: ignore
      retention-days: 7
  - name: Install capture dependencies
    if: inputs.capture == 'true'
    shell: bash
    run: pip install -r marketing/requirements.txt
  - name: Export verified native screenshots
    if: inputs.capture == 'true'
    shell: bash
    env:
      FAMILY: ${{ inputs.profile }}
      SHARD: ${{ inputs.shard }}
    run: |
      results="$RUNNER_TEMP/onionary-tests"
      bundle="$results/Onionary.xcresult"
      options=()
      if [[ "$FAMILY" == duo ]]; then
        bundle="$results/duo/$SHARD/Onionary.xcresult"
        options+=(--duo-fold-result "$bundle")
      fi
      python3 execution/marketing_screenshots.py --result-bundle "$bundle" \
        --family "$FAMILY" --output ".tmp/marketing/$FAMILY" --defer-creative "${options[@]}"
  - name: Upload verified native screenshots
    if: inputs.capture == 'true'
    uses: actions/upload-artifact@v4
    with:
      name: onionary-capture-${{ inputs.profile }}-en-US
      path: |
        .tmp/marketing/${{ inputs.profile }}/
        !.tmp/marketing/${{ inputs.profile }}/attachments/**
        !.tmp/marketing/${{ inputs.profile }}/fold/**
      if-no-files-found: error
      retention-days: 14
  - name: Mark captures available for packaging
    if: inputs.capture == 'true'
    id: captures
    shell: bash
    run: echo 'available=true' >> "$GITHUB_OUTPUT"
