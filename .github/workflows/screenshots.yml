name: App Store screenshots
on:
  push:
    branches: [main, 'codex/**']
    paths: ['ios/**', 'marketing/**', 'execution/render_marketing_assets.py', 'execution/marketing_screenshots.py', 'execution/package_marketing_screenshots.py', '.github/workflows/screenshots.yml']
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone 17 Pro
            family: iphone
          - device: iPad Pro 13-inch (M5)
            family: ipad
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r marketing/requirements.txt
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - run: python3 ios/Onionary/Scripts/ensure_ios_runtimes.py 27.0
      - run: brew install xcodegen
      - name: Capture real app screenshots
        env:
          DEVICE: ${{ matrix.device }}
          FAMILY: ${{ matrix.family }}
        run: python3 execution/marketing_screenshots.py --defer-creative --device "$DEVICE" --output ".tmp/marketing/$FAMILY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onionary-capture-${{ matrix.family }}-en-US
          path: |
            .tmp/marketing/${{ matrix.family }}/
            !.tmp/marketing/${{ matrix.family }}/DerivedData/**
          retention-days: 14

  creative:
    needs: screenshots
    strategy:
      matrix:
        family: [iphone, ipad]
    uses: Malaber/github-workflows/.github/workflows/reusable-appstore-creative.yml@2e162b82a123229371804e967273fce54b36b19f
    with:
      screenshot_artifact: onionary-capture-${{ matrix.family }}-en-US
      screenshot_glob: en-US/02-cooking-companion*.png
      output_artifact: onionary-creative-${{ matrix.family }}-en-US

  bundle:
    needs: creative
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        family: [iphone, ipad]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: onionary-capture-${{ matrix.family }}-en-US
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: onionary-creative-${{ matrix.family }}-en-US
          path: bundle/creative
      - uses: actions/upload-artifact@v4
        with:
          name: onionary-appstore-${{ matrix.family }}-en-US
          path: bundle/
          retention-days: 14
          if-no-files-found: error

  release-assets:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: screenshot-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release belongs to main
        id: main
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "Screenshots remain workflow artifacts: release commit is not on main." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v4
        if: steps.main.outputs.eligible == 'true'
        with:
          pattern: onionary-appstore-*-en-US
          path: screenshots
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r marketing/requirements.txt
      - name: Package PNGs and attach to matching release
        if: steps.main.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 execution/package_marketing_screenshots.py screenshots release-assets
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
