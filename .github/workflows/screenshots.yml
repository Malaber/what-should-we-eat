name: App Store screenshots
on:
  workflow_call:
permissions:
  contents: read
jobs:
  creative:
    strategy:
      matrix:
        family: [iphone, ipad]
    uses: Malaber/github-workflows/.github/workflows/reusable-appstore-creative.yml@0fa17543c28e0d43ff74d14ffbbe9c86ddde3bf2
    with:
      screenshot_artifact: onionary-capture-${{ matrix.family }}-en-US
      screenshot_glob: en-US/02-cooking-companion*.png
      output_artifact: onionary-creative-${{ matrix.family }}-en-US

  bundle:
    needs: creative
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        family: [iphone, ipad]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: onionary-capture-${{ matrix.family }}-en-US
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: onionary-creative-${{ matrix.family }}-en-US
          path: bundle/creative
      - uses: actions/upload-artifact@v4
        with:
          name: onionary-appstore-${{ matrix.family }}-en-US
          path: bundle/
          retention-days: 14
          if-no-files-found: error

  release-assets:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: screenshot-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release belongs to main
        id: main
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "Screenshots remain workflow artifacts: release commit is not on main." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v4
        if: steps.main.outputs.eligible == 'true'
        with:
          pattern: onionary-appstore-*-en-US
          path: screenshots
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r marketing/requirements.txt
      - name: Package PNGs and attach to matching release
        if: steps.main.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 execution/package_marketing_screenshots.py screenshots release-assets
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
