name: App Store screenshots
on:
  workflow_call:
permissions:
  contents: read
jobs:
  creative:
    uses: Malaber/github-workflows/.github/workflows/reusable-appstore-creative.yml@0fa17543c28e0d43ff74d14ffbbe9c86ddde3bf2
    with:
      screenshot_artifact: onionary-capture-iphone-en-US
      screenshot_glob: en-US/02-cooking-companion.png
      output_artifact: onionary-creative-en-US

  bundle:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        family: [iphone, ipad, duo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: onionary-capture-${{ matrix.family }}-en-US
          path: bundle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r marketing/requirements.txt
      - name: Verify the completed screenshot bundle
        run: python execution/package_marketing_screenshots.py --validate-family ${{ matrix.family }} bundle/en-US
      - uses: actions/upload-artifact@v4
        with:
          name: onionary-appstore-${{ matrix.family }}-en-US
          path: bundle/
          retention-days: 14
          if-no-files-found: error

  bundle-creative:
    needs: creative
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: onionary-capture-iphone-en-US
          path: base-capture
      - uses: actions/download-artifact@v4
        with:
          name: onionary-creative-en-US
          path: bundle/en-US/creative
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r marketing/requirements.txt
      - name: Verify shared artwork against this run's iPhone capture
        run: |
          python execution/package_marketing_screenshots.py --validate-family creative \
            --creative-source base-capture/en-US/02-cooking-companion.png bundle/en-US/creative
      - uses: actions/upload-artifact@v4
        with:
          name: onionary-appstore-creative-en-US
          path: bundle/
          retention-days: 14
          if-no-files-found: error

  package-release-bundles:
    needs: [bundle, bundle-creative]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: onionary-appstore-*-en-US
          path: screenshots
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r marketing/requirements.txt
      - name: Validate and package all four release bundles
        run: python3 execution/package_marketing_screenshots.py screenshots release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: onionary-github-release-assets
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 14

  release-assets:
    needs: package-release-bundles
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: screenshot-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release belongs to main
        id: main
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "Screenshots remain workflow artifacts: release commit is not on main." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v4
        if: steps.main.outputs.eligible == 'true'
        with:
          name: onionary-github-release-assets
          path: release-assets
      - name: Attach verified PNG bundles to matching release
        if: steps.main.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release-assets/*.zip --verify-tag --generate-notes "${flags[@]}"
          else
            gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
          fi
