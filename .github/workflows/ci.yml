name: Build and test
on:
  push:
    # Feature PRs run the complete suite via pull_request, once per update.
    # Keep deployment/release pushes independently validated and publishable.
    branches: [main, 'codex/onionary-ios-companion']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: sqlite:///ci.db
      SECRET_KEY: ci-only-secret-not-for-production-32-bytes
      APP_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt -r marketing/requirements.txt
      - run: sudo --preserve-env=GITHUB_ACTIONS python3 execution/configure_ci_apt.py
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends inkscape
      - run: python -m execution.db.init_db
      - run: python -m pytest
      - run: docker build -t onionary:ci .
      - name: Test packaged Python 3.14 app against PostgreSQL
        run: python execution/test_container.py --image onionary:ci
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt -r marketing/requirements.txt
      - run: sudo --preserve-env=GITHUB_ACTIONS python3 execution/configure_ci_apt.py
      - run: sudo apt-get update
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest execution/tests/e2e -o addopts='' --browser chromium
      - run: python -m pytest execution/tests/e2e -o addopts='' --browser chromium --device='iPhone 13'
  ios-build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: brew install xcodegen
      - name: Run Swift tests and compile the simulator test bundle
        env:
          TEST_RESULTS_DIR: ${{ runner.temp }}/onionary-build
        run: |
          bash ios/Onionary/Scripts/test.sh --build-only
          tar -czf "$RUNNER_TEMP/onionary-test-products.tar.gz" -C "$TEST_RESULTS_DIR/DerivedData" Build/Products
      - uses: actions/upload-artifact@v4
        with:
          name: onionary-ios-test-products
          path: ${{ runner.temp }}/onionary-test-products.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: onionary-ios-test-build-log
          path: ${{ runner.temp }}/onionary-build/build.log
          retention-days: 7
  ios-advisory:
    name: ios advisory (${{ matrix.profile }}, ${{ matrix.shard }})
    needs: ios-build
    # Temporary exception for standard-runner launch failures. See directives/run_tests.md.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: iphone
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
            shard: '2'
          - profile: iphone
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
            shard: '3'
          - profile: ipad
            device: com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB
            shard: '2'
          - profile: ipad
            device: com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB
            shard: '3'
          - profile: duo
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-Duo
            shard: testRecipeDraftSurvivesFolds,testRecipePreviewAndChecklistSurviveFolds
          - profile: duo
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-Duo
            shard: testExpiredSessionKeepsAdaptiveNavigationReachable,testKitchenShoppingChecksSurviveFolds
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-ios
        with:
          profile: ${{ matrix.profile }}
          device: ${{ matrix.device }}
          shard: ${{ matrix.shard }}

  iphone-captures:
    name: ios advisory (iphone, 1)
    needs: ios-build
    continue-on-error: true
    runs-on: xcode-27
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    outputs:
      available: ${{ steps.native.outputs.captures }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-ios
        id: native
        with:
          profile: iphone
          device: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
          shard: '1'
          capture: 'true'

  ipad-captures:
    name: ios advisory (ipad, 1)
    needs: ios-build
    continue-on-error: true
    runs-on: xcode-27
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    outputs:
      available: ${{ steps.native.outputs.captures }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-ios
        id: native
        with:
          profile: ipad
          device: com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB
          shard: '1'
          capture: 'true'

  duo-captures:
    name: ios advisory (duo, testMarketingScreenshots)
    needs: ios-build
    continue-on-error: true
    runs-on: xcode-27
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    outputs:
      available: ${{ steps.native.outputs.captures }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-ios
        id: native
        with:
          profile: duo
          device: com.apple.CoreSimulator.SimDeviceType.iPhone-Duo
          shard: testMarketingScreenshots
          capture: 'true'

  appstore-screenshots:
    needs: [iphone-captures, ipad-captures, duo-captures]
    if: >-
      !cancelled() && needs.iphone-captures.outputs.available == 'true' &&
      needs.ipad-captures.outputs.available == 'true' &&
      needs.duo-captures.outputs.available == 'true'
    uses: ./.github/workflows/screenshots.yml
    permissions:
      contents: write

  ios-archive:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify matching Xcode build
        run: python3 execution/check_ios_build_environment.py --xcode-only
      - run: brew install xcodegen
      - name: Archive Release for iOS devices and validate all bundles
        run: |
          bash ios/Onionary/Scripts/archive.sh "${{ runner.temp }}/Onionary.xcarchive" \
            "$(python3 execution/version.py --ios)" "${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: onionary-unsigned-device-archive
          path: ${{ runner.temp }}/Onionary.xcarchive
          retention-days: 7

  publish-image:
    needs: [backend, browser]
    if: github.event_name != 'pull_request' && github.repository == 'Malaber/what-should-we-eat'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tag-based version
        id: version
        run: echo "value=$(python3 execution/version.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/malaber/what-should-we-eat
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/codex/onionary-ios-companion' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-main:
    needs: [backend, browser, ios-build, ios-archive, publish-image, html-format, appstore-screenshots]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'Malaber/what-should-we-eat' &&
      needs.backend.result == 'success' && needs.browser.result == 'success' &&
      needs.ios-build.result == 'success' && needs.ios-archive.result == 'success' &&
      needs.publish-image.result == 'success' && needs.html-format.result == 'success' &&
      (needs.appstore-screenshots.result == 'success' || needs.appstore-screenshots.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: stable-main-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: needs.appstore-screenshots.result == 'success'
        with:
          name: onionary-github-release-assets
          path: ${{ runner.temp }}/release-assets
      - name: Prepare stable version and release notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m execution.release_main
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish versioned production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/malaber/what-should-we-eat:${{ steps.release.outputs.version }}
            ghcr.io/malaber/what-should-we-eat:latest
            ghcr.io/malaber/what-should-we-eat:main
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SCREENSHOT_RESULT: ${{ needs.appstore-screenshots.result }}
        run: |
          if [[ "$SCREENSHOT_RESULT" == success ]]; then
            python3 -m execution.release_main --publish-assets "$RUNNER_TEMP/release-assets"
          else
            echo 'Hosted simulator captures were unavailable. Publishing the production release.' >> "$GITHUB_STEP_SUMMARY"
            python3 -m execution.release_main --publish
          fi

  html-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:html
