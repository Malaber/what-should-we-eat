name: Build and test
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///ci.db
      SECRET_KEY: ci-only-secret-not-for-production-32-bytes
      APP_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m execution.db.init_db
      - run: python -m pytest
      - run: docker build -t onionary:ci .
      - name: Test packaged Python 3.14 app against PostgreSQL
        run: python execution/test_container.py --image onionary:ci
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest execution/tests/e2e -o addopts='' --browser chromium
      - run: python -m pytest execution/tests/e2e -o addopts='' --browser chromium --device='iPhone 13'
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode 26 or newer
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | awk '{ if ($2 + 0 < 26) exit 1 }'
      - run: brew install xcodegen
      - name: Core tests, simulator build, and UI tests
        run: bash ios/Onionary/Scripts/test.sh

  publish-image:
    needs: [backend, browser]
    if: github.event_name != 'pull_request' && github.repository == 'Malaber/what-should-we-eat'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tag-based version
        id: version
        run: echo "value=$(python3 execution/version.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/malaber/what-should-we-eat
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/codex/onionary-ios-companion' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
