name: Build and test
on:
  push:
    # Feature PRs run the complete suite via pull_request, once per update.
    # Keep deployment/release pushes independently validated and publishable.
    branches: [main, 'codex/onionary-ios-companion']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: sqlite:///ci.db
      SECRET_KEY: ci-only-secret-not-for-production-32-bytes
      APP_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt -r marketing/requirements.txt
      - run: sudo --preserve-env=GITHUB_ACTIONS python3 execution/configure_ci_apt.py
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends inkscape
      - run: python -m execution.db.init_db
      - run: python -m pytest
      - run: docker build -t onionary:ci .
      - name: Test packaged Python 3.14 app against PostgreSQL
        run: python execution/test_container.py --image onionary:ci
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt -r marketing/requirements.txt
      - run: sudo --preserve-env=GITHUB_ACTIONS python3 execution/configure_ci_apt.py
      - run: sudo apt-get update
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest execution/tests/e2e -o addopts='' --browser chromium
      - run: python -m pytest execution/tests/e2e -o addopts='' --browser chromium --device='iPhone 13'
  ios-build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: brew install xcodegen
      - name: Run Swift tests and compile the simulator test bundle
        env:
          TEST_RESULTS_DIR: ${{ runner.temp }}/onionary-build
        run: |
          bash ios/Onionary/Scripts/test.sh --build-only
          tar -czf "$RUNNER_TEMP/onionary-test-products.tar.gz" -C "$TEST_RESULTS_DIR/DerivedData" Build/Products
      - uses: actions/upload-artifact@v4
        with:
          name: onionary-ios-test-products
          path: ${{ runner.temp }}/onionary-test-products.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: onionary-ios-test-build-log
          path: ${{ runner.temp }}/onionary-build/build.log
          retention-days: 7
  ios:
    name: ios (${{ matrix.profile }}, ${{ matrix.shard }})
    needs: ios-build
    strategy:
      fail-fast: false
      matrix:
        profile: [iphone, ipad]
        shard: ['1', '2', '3']
        include:
          - profile: iphone
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
            runtime: '27.0'
          - profile: ipad
            device: com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB
            runtime: '27.0'
          - profile: duo
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-Duo
            runtime: '27.1'
            shard: testRecipePreviewAndChecklistSurviveFolds
          - profile: duo
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-Duo
            runtime: '27.1'
            shard: testMarketingScreenshots
          - profile: duo
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-Duo
            runtime: '27.1'
            shard: testRecipeDraftSurvivesFolds
          - profile: duo
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-Duo
            runtime: '27.1'
            shard: testKitchenShoppingChecksSurviveFolds
          - profile: duo
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-Duo
            runtime: '27.1'
            shard: testExpiredSessionKeepsAdaptiveNavigationReachable
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify matching Xcode build
        run: python3 execution/check_ios_build_environment.py --xcode-only
      - run: python3 ios/Onionary/Scripts/ensure_ios_runtimes.py '${{ matrix.runtime }}'
      - uses: actions/download-artifact@v4
        with:
          name: onionary-ios-test-products
          path: ${{ runner.temp }}
      - name: Run UI tests on the pinned simulator
        timeout-minutes: 60
        env:
          TEST_RESULTS_DIR: ${{ runner.temp }}/onionary-tests
          SIMULATOR_DEVICE_TYPE: ${{ matrix.device }}
          SIMULATOR_RUNTIME: ${{ matrix.runtime }}
          SIMULATOR_TEST_SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$TEST_RESULTS_DIR/DerivedData"
          tar -xzf "$RUNNER_TEMP/onionary-test-products.tar.gz" -C "$TEST_RESULTS_DIR/DerivedData"
          bash ios/Onionary/Scripts/test.sh --test-only
      - if: matrix.shard == '1'
        run: pip install -r marketing/requirements.txt
      - name: Export captures from this test run
        if: matrix.shard == '1'
        env:
          FAMILY: ${{ matrix.profile }}
          RESULT_BUNDLE: ${{ runner.temp }}/onionary-tests/Onionary.xcresult
        run: python3 execution/marketing_screenshots.py --result-bundle "$RESULT_BUNDLE" --family "$FAMILY" --output ".tmp/marketing/$FAMILY" --defer-creative
      - uses: actions/upload-artifact@v4
        if: matrix.shard == '1'
        with:
          name: onionary-capture-${{ matrix.profile }}-en-US
          path: |
            .tmp/marketing/${{ matrix.profile }}/
            !.tmp/marketing/${{ matrix.profile }}/attachments/**
          if-no-files-found: error
          retention-days: 14
      - name: Preserve passing Duo screenshot results
        uses: actions/upload-artifact@v4
        if: matrix.profile == 'duo' && (matrix.shard == 'testMarketingScreenshots' || matrix.shard == 'testRecipePreviewAndChecklistSurviveFolds')
        with:
          name: onionary-duo-result-${{ matrix.shard }}
          path: ${{ runner.temp }}/onionary-tests/duo/${{ matrix.shard }}/Onionary.xcresult/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve simulator test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onionary-ios-test-results-${{ matrix.profile }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/onionary-tests/Onionary.xcresult
            ${{ runner.temp }}/onionary-tests/*.log
            ${{ runner.temp }}/onionary-tests/duo/
            ${{ runner.temp }}/onionary-tests/host-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  duo-captures:
    needs: ios
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r marketing/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: onionary-duo-result-testMarketingScreenshots
          path: ${{ runner.temp }}/DuoMarketing.xcresult
      - uses: actions/download-artifact@v4
        with:
          name: onionary-duo-result-testRecipePreviewAndChecklistSurviveFolds
          path: ${{ runner.temp }}/DuoFold.xcresult
      - name: Export validated iPhone Duo scenes
        run: |
          python3 execution/marketing_screenshots.py \
            --result-bundle "$RUNNER_TEMP/DuoMarketing.xcresult" \
            --duo-fold-result "$RUNNER_TEMP/DuoFold.xcresult" \
            --family duo --output .tmp/marketing/duo --defer-creative
      - uses: actions/upload-artifact@v4
        with:
          name: onionary-capture-duo-en-US
          path: |
            .tmp/marketing/duo/
            !.tmp/marketing/duo/attachments/**
            !.tmp/marketing/duo/fold/**
          if-no-files-found: error
          retention-days: 14

  appstore-screenshots:
    needs: [ios, duo-captures]
    uses: ./.github/workflows/screenshots.yml
    permissions:
      contents: write

  ios-archive:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify matching Xcode build
        run: python3 execution/check_ios_build_environment.py --xcode-only
      - run: brew install xcodegen
      - name: Archive Release for iOS devices and validate all bundles
        run: |
          bash ios/Onionary/Scripts/archive.sh "${{ runner.temp }}/Onionary.xcarchive" \
            "$(python3 execution/version.py --ios)" "${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: onionary-unsigned-device-archive
          path: ${{ runner.temp }}/Onionary.xcarchive
          retention-days: 7

  publish-image:
    needs: [backend, browser]
    if: github.event_name != 'pull_request' && github.repository == 'Malaber/what-should-we-eat'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tag-based version
        id: version
        run: echo "value=$(python3 execution/version.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/malaber/what-should-we-eat
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/codex/onionary-ios-companion' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-main:
    needs: [backend, browser, ios, ios-archive, publish-image, html-format, appstore-screenshots]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Malaber/what-should-we-eat'
    runs-on: ubuntu-latest
    concurrency:
      group: stable-main-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: onionary-github-release-assets
          path: ${{ runner.temp }}/release-assets
      - name: Prepare stable version and release notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m execution.release_main
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish versioned production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/malaber/what-should-we-eat:${{ steps.release.outputs.version }}
            ghcr.io/malaber/what-should-we-eat:latest
            ghcr.io/malaber/what-should-we-eat:main
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
      - name: Publish GitHub release with verified screenshot bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m execution.release_main --publish-assets "$RUNNER_TEMP/release-assets"

  html-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:html
