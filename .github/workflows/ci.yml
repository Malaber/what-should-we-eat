name: Build and test
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///ci.db
      SECRET_KEY: ci-only-secret-not-for-production-32-bytes
      APP_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt -r marketing/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y inkscape
      - run: python -m execution.db.init_db
      - run: python -m pytest
      - run: docker build -t onionary:ci .
      - name: Test packaged Python 3.14 app against PostgreSQL
        run: python execution/test_container.py --image onionary:ci
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt -r marketing/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest execution/tests/e2e -o addopts='' --browser chromium
      - run: python -m pytest execution/tests/e2e -o addopts='' --browser chromium --device='iPhone 13'
  ios:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: iphone
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
            runtime: '27.0'
          - profile: ipad
            device: com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-16GB
            runtime: '27.0'
          - profile: duo
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-Duo
            runtime: '27.1'
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - run: python3 ios/Onionary/Scripts/ensure_ios_runtimes.py '${{ matrix.runtime }}'
      - run: brew install xcodegen
      - name: Core tests, simulator build, and UI tests
        timeout-minutes: 45
        env:
          TEST_RESULTS_DIR: ${{ runner.temp }}/onionary-tests
          SIMULATOR_DEVICE_TYPE: ${{ matrix.device }}
        run: bash ios/Onionary/Scripts/test.sh
      - name: Preserve simulator test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onionary-ios-test-results-${{ matrix.profile }}
          path: ${{ runner.temp }}/onionary-tests/Onionary.xcresult
          if-no-files-found: ignore
          retention-days: 7

  ios-archive:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - run: brew install xcodegen
      - name: Archive Release for iOS devices and validate all bundles
        run: |
          bash ios/Onionary/Scripts/archive.sh "${{ runner.temp }}/Onionary.xcarchive" \
            "$(python3 execution/version.py --ios)" "${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: onionary-unsigned-device-archive
          path: ${{ runner.temp }}/Onionary.xcarchive
          retention-days: 7

  publish-image:
    needs: [backend, browser]
    if: github.event_name != 'pull_request' && github.repository == 'Malaber/what-should-we-eat'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tag-based version
        id: version
        run: echo "value=$(python3 execution/version.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/malaber/what-should-we-eat
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/codex/onionary-ios-companion' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-main:
    needs: [backend, browser, ios, ios-archive, publish-image, html-format]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Malaber/what-should-we-eat'
    runs-on: ubuntu-latest
    concurrency:
      group: stable-main-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish stable release from merged PR
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 execution/release_main.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish versioned production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/malaber/what-should-we-eat:${{ steps.release.outputs.version }}
            ghcr.io/malaber/what-should-we-eat:latest
            ghcr.io/malaber/what-should-we-eat:main
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
      - name: Generate screenshots for this release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run screenshots.yml --ref "$RELEASE_TAG"

  html-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:html
