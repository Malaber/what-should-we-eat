name: Onionary
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  OnionaryCore:
    path: .
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: VWKG94374J
targets:
  Onionary:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - App
      - path: AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: OnionaryCore
      - target: OnionaryShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malaber.onionary
        PRODUCT_NAME: Onionary
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Onionary
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
    entitlements:
      path: App/Onionary.entitlements
      properties:
        com.apple.security.application-groups: [group.de.malaber.onionary]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: de.malaber.onionary.auth
            CFBundleURLSchemes: [de.malaber.onionary]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  OnionaryShare:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources: [ShareExtension]
    dependencies:
      - package: OnionaryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malaber.onionary.share
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 1
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1,2'
    entitlements:
      path: ShareExtension/OnionaryShare.entitlements
      properties:
        com.apple.security.application-groups: [group.de.malaber.onionary]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Onionary
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  OnionaryUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '17.0'
    sources: [UITests]
    dependencies:
      - target: Onionary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malaber.onionary.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Onionary:
    build:
      targets:
        Onionary: all
    test:
      targets: [OnionaryUITests]
