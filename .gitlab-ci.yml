stages:
  - test
  - e2e
  - build

unit-tests:
  stage: test
  image: python:3.12-slim
  variables:
    DATABASE_URL: "sqlite:///test.db"
    SECRET_KEY: "ci-test-secret"
    DEMO_HOUSEHOLD_ID: "99999"
  script:
    - pip install --no-cache-dir -r requirements.txt
    - python -m pytest --tb=short -q
  only:
    - main
    - merge_requests

e2e-tests:
  stage: e2e
  image: mcr.microsoft.com/playwright/python:v1.58.0-jammy
  variables:
    DATABASE_URL: "sqlite://"
    SECRET_KEY: "ci-e2e-test-secret"
    DEMO_HOUSEHOLD_ID: "99999"
  script:
    - pip install --no-cache-dir -r requirements.txt
    - playwright install chromium
    - python3 -m pytest execution/tests/e2e/ -o addopts='' --browser chromium -v --tb=short --screenshot=only-on-failure --video=retain-on-failure --output=test-results
    - python3 -m pytest execution/tests/e2e/ -o addopts='' --browser chromium -v --tb=short --device="iPhone 13" --screenshot=only-on-failure --video=retain-on-failure --output=test-results
  only:
    - main
    - merge_requests

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
  only:
    - main
