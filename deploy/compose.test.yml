name: onionary-test
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onionary
      POSTGRES_DB: onionary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U onionary -d onionary']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    image: ${ONIONARY_IMAGE:-ghcr.io/malaber/what-should-we-eat:development}
    command: [python, -m, execution.db.init_db]
    environment: &backend-env
      DATABASE_URL: postgresql://onionary:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/onionary
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      APP_BASE_URL: https://${BACKEND_HOST:?Set BACKEND_HOST}
      ALLOW_LEGACY_PASSWORD_AUTH: 'false'
      DEMO_HOUSEHOLD_ID: '0'
    depends_on:
      db:
        condition: service_healthy
  api:
    image: ${ONIONARY_IMAGE:-ghcr.io/malaber/what-should-we-eat:development}
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      BACKEND_HOST: ${BACKEND_HOST:?Set BACKEND_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
volumes:
  pgdata:
  caddy_data:
  caddy_config:
