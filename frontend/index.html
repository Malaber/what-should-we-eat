<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What Should We Eat?</title>
  <meta name="description"
    content="Plan your weekly meals — pick recipes, filter by tags, and generate a shopping list." />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🧄</text></svg>" />
</head>

<body>

  <!-- ─── Navigation ─────────────────────────────────────────── -->
  <nav class="top-nav">
    <div class="container nav-container">
      <button class="burger-btn" id="burger-btn" aria-label="Toggle menu">☰</button>
      <div id="auth-mount" class="nav-auth-mount"></div>
      <div class="nav-links" id="nav-links">
        <a href="/" class="nav-link active">Pick Meals</a>
        <a href="/kitchen.html" class="nav-link">Kitchen</a>
        <a href="/recipes.html" class="nav-link">Manage Recipes</a>
        <a href="/households.html" class="nav-link">Households</a>
      </div>
    </div>
  </nav>

  <!-- ─── Header ─────────────────────────────────────────────── -->
  <header class="site-header">
    <div class="container">
      <h1>What Should <span class="accent-orange">We</span> <span class="accent-green">Eat</span>?</h1>
      <p class="tagline">Pick your meals for the week, we'll handle the shopping list.</p>
    </div>
  </header>

  <main class="container">

    <!-- ─── Controls ─────────────────────────────────────────── -->
    <section class="controls" id="controls">
      <div class="controls-row">
        <div class="control-group" style="max-width: 140px;">
          <label for="recipe-count">How many?</label>
          <input type="number" id="recipe-count" min="1" max="20" value="5" />
        </div>
        <div class="control-group" style="max-width: 160px;">
          <label for="max-kcal">Max kcal / serving</label>
          <input type="number" id="max-kcal" placeholder="any" min="0" step="50" />
        </div>
        <div class="control-group" style="max-width: 160px;">
          <label for="max-time">Max total time (min)</label>
          <input type="number" id="max-time" placeholder="any" min="0" step="5" />
        </div>
      </div>

      <div class="control-group" style="margin-top:16px;">
        <label>Filter by tags</label>
        <div class="tag-selector" id="tag-selector">
          <!-- filled by JS -->
        </div>
      </div>

      <div class="controls-actions">
        <button class="btn btn-primary" id="btn-roll">
          🎲 Roll Recipes
        </button>
        <button class="btn btn-secondary" id="btn-reroll-all" style="display:none;">
          🗑️ Clear All
        </button>
      </div>
    </section>

    <!-- ─── Selected Recipes ─────────────────────────────────── -->
    <section id="recipes-section" style="display:none;">
      <div class="section-header" style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Your Meals <span class="badge" id="recipe-badge">0</span></h2>
        <button class="btn btn-primary" id="btn-kitchen" style="display:none;">🧄 Send to Kitchen</button>
      </div>
      <div class="recipes-grid" id="recipes-grid">
        <!-- filled by JS -->
      </div>
    </section>

    <!-- ─── Shopping List ────────────────────────────────────── -->
    <section class="shopping-section" id="shopping-section" style="display:none;">
      <div class="shopping-card">
        <div class="shopping-card-header">
          <h2>🛒 Shopping List</h2>
          <span class="badge" id="shop-badge" style="background:var(--green-pale);color:var(--green-dark);">0</span>
        </div>
        <ul class="shopping-list" id="shopping-list">
          <!-- filled by JS -->
        </ul>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div style="font-size: 0.85rem;">
        <a href="/impressum.html" style="color: var(--text-muted); text-decoration: none;">Impressum</a>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="/auth.js"></script>
  <script src="/app.js"></script>
</body>

</html>
