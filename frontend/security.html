<!doctype html>

<html lang="en">
  <head>
    <script src="/translations.js"></script>
    <script src="/i18n.js"></script>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>Your passkeys · Onionary</title>
    <link href="/passkey.css" rel="stylesheet" />
    <script src="/security.js" type="module"></script>
  </head>
  <body class="auth-surface">
    <main>
      <div aria-hidden="true" class="mark">🧅</div>
      <p class="eyebrow" data-i18n="security.copy_0"></p>
      <h1 data-i18n="security.copy_1"></h1>
      <p data-i18n="security.copy_2"></p>
      <p id="error" role="alert"></p>
      <p id="status" role="status"></p>
      <div id="keys"></div>
      <button data-i18n="security.copy_3" id="add"></button
      ><button data-i18n="security.copy_4" id="replace"></button
      ><button data-i18n="security.copy_5" id="delete-all"></button
      ><a data-i18n="security.copy_6" href="/"></a>
      <dialog class="auth-surface" id="action-dialog">
        <form id="action-form">
          <h2 id="action-title"></h2>
          <p id="action-copy"></p>
          <label id="name-label"
            ><span data-i18n="security.copy_7"></span><input id="key-name" maxlength="120" /></label
          ><label hidden="" id="confirm-label"
            ><span data-i18n="security.copy_8"></span
            ><input autocomplete="off" id="confirmation" /></label
          ><button data-i18n="security.copy_9" type="submit"></button
          ><button data-i18n="security.copy_10" id="cancel" type="button"></button>
        </form>
      </dialog>
    </main>
  </body>
</html>
