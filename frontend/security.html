<!doctype html>

<html lang="en">
  <head>
    <script src="/translations.js"></script>
    <script src="/i18n.js"></script>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <title>Account · Onionary</title>
    <link href="/styles.css" rel="stylesheet" />
    <link href="/passkey.css" rel="stylesheet" />
    <script src="/security.js" type="module"></script>
  </head>
  <body class="auth-surface account-page">
    <nav class="top-nav">
      <div class="container nav-container">
        <button
          aria-label="Toggle menu"
          class="burger-btn"
          id="burger-btn"
          aria-controls="nav-links"
          aria-expanded="false"
        >
          ☰
        </button>
        <div class="nav-links" id="nav-links">
          <a class="nav-link" data-i18n="nav.pick_meals" href="/">Pick meals</a>
          <a class="nav-link" data-i18n="nav.kitchen" href="/kitchen.html">Kitchen</a>
          <a class="nav-link" data-i18n="nav.manage_recipes" href="/recipes.html">Recipes</a>
          <a class="nav-link" data-i18n="nav.households" href="/households.html">Households</a>
        </div>
      </div>
    </nav>
    <main>
      <a class="account-back" data-i18n="security.copy_6" href="/kitchen.html"
        >Back to your kitchen</a
      >
      <div aria-hidden="true" class="mark">🧅</div>
      <p class="eyebrow" data-i18n="security.copy_0"></p>
      <h1 data-i18n="account.title"></h1>
      <p data-i18n="security.copy_2"></p>
      <p id="error" role="alert"></p>
      <p id="status" role="status"></p>
      <section class="account-section">
        <form id="profile-form">
          <label
            ><span data-i18n="account.name"></span
            ><input id="profile-name" required maxlength="120" disabled
          /></label>
          <p id="profile-email"></p>
          <button data-i18n="account.save" disabled></button>
        </form>
        <label
          ><span data-i18n="account.language"></span
          ><select id="account-language">
            <option value="system" data-i18n="account.system"></option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
          </select></label
        >
        <label
          ><span data-i18n="account.appearance"></span
          ><select id="account-appearance">
            <option value="system" data-i18n="account.system"></option>
            <option value="light" data-i18n="account.light"></option>
            <option value="dark" data-i18n="account.dark"></option></select
        ></label>
      </section>
      <section aria-labelledby="danger-title">
        <h2 id="danger-title" data-i18n="deletion.title">Danger zone</h2>
        <a class="danger" href="/auth/account/delete" data-i18n="deletion.button"
          >Permanently delete account</a
        >
      </section>
      <h2 data-i18n="auth.keys"></h2>
      <p class="help" data-i18n="account.keep-key"></p>
      <div id="keys"></div>
      <button data-i18n="security.copy_3" id="add"></button>
      <dialog class="auth-surface" id="action-dialog">
        <form id="action-form">
          <h2 id="action-title"></h2>
          <p id="action-copy"></p>
          <label id="name-label"
            ><span data-i18n="security.copy_7"></span><input id="key-name" maxlength="120" /></label
          ><button data-i18n="security.copy_9" type="submit"></button
          ><button data-i18n="security.copy_10" id="cancel" type="button"></button>
        </form>
      </dialog>
    </main>
    <script src="/auth.js"></script>
  </body>
</html>
