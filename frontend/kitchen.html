<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen - What Should We Eat?</title>
  <meta name="description" content="Prepare and cook your selected meals." />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🍳</text></svg>" />
</head>
<body>

  <!-- ─── Navigation ─────────────────────────────────────────── -->
  <nav class="top-nav">
    <div class="container nav-container" style="display: flex; justify-content: space-between; width: 100%;">
      <div style="display: flex; gap: 24px; align-items: center;">
        <a href="/" class="nav-link">Pick Meals</a>
        <a href="/kitchen.html" class="nav-link active">Kitchen</a>
        <a href="/recipes.html" class="nav-link">Manage Recipes</a>
        <a href="/households.html" class="nav-link">Households</a>
      </div>
      <div id="auth-mount"></div>
    </div>
  </nav>

  <!-- ─── Header ─────────────────────────────────────────────── -->
  <header class="site-header">
    <div class="container">
      <h1>Your <span class="accent-orange">Kitchen</span></h1>
      <p class="tagline">Time to cook! Tap a meal to view ingredients and instructions.</p>
    </div>
  </header>

  <main class="container">
    <div id="empty-state" style="text-align:center; padding: 60px 20px; display:none;">
      <div style="font-size:4rem; margin-bottom:1rem;">🍽️</div>
      <h2 style="margin-bottom:1rem;">Your kitchen is empty</h2>
      <p style="color:var(--text-light); margin-bottom:2rem;">You haven't sent any meals to the kitchen yet.</p>
      <a href="/" class="btn btn-primary" style="display:inline-block; text-decoration:none;">Go Pick Meals</a>
    </div>

    <section id="kitchen-section" style="display:none;">
      <div class="recipes-grid" id="kitchen-grid">
        <!-- filled by JS -->
      </div>
    </section>
  </main>

  <!-- ─── Meal Detail Modal ──────────────────────────────────── -->
  <div class="modal-overlay" id="meal-modal" style="display:none; z-index:7000;">
    <div class="modal" style="max-width:700px; width:90%; max-height:90vh; overflow-y:auto; padding:32px; position:relative;">
      <button class="btn btn-icon" id="btn-close-modal" style="position:absolute; top:16px; right:16px; box-shadow:none; border:none;">✕</button>
      <h2 id="modal-title" style="font-family:var(--font-display); font-size:1.8rem; margin-bottom:12px;"></h2>
      <div id="modal-meta" style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px;"></div>

      <h3 style="margin-bottom:12px; font-size:1.1rem; color:var(--text-light);">Ingredients</h3>
      <ul id="modal-ingredients" style="list-style:none; padding:0; margin-bottom:32px;"></ul>

      <h3 style="margin-bottom:12px; font-size:1.1rem; color:var(--text-light);">Instructions</h3>
      <div id="modal-instructions" style="display:flex; flex-direction:column; gap:16px; margin-bottom:32px;"></div>

      <div style="text-align:center;">
        <button id="btn-toggle-cooked" class="btn btn-primary" style="padding:16px 32px; font-size:1.2rem; width:100%; max-width:400px;">✅ Mark as Cooked</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      Made with 🍳 — <em>What Should We Eat?</em>
    </div>
  </footer>

  <script src="/auth.js"></script>
  <script src="/kitchen.js"></script>
</body>
</html>
