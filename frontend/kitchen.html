<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen - What Should We Eat?</title>
  <meta name="description" content="Prepare and cook your selected meals." />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🍳</text></svg>" />
</head>
<body>

  <!-- ─── Navigation ─────────────────────────────────────────── -->
  <nav class="top-nav">
    <div class="container nav-container">
      <a href="/" class="nav-link">Pick Meals</a>
      <a href="/kitchen.html" class="nav-link active">Kitchen</a>
      <a href="/recipes.html" class="nav-link">Manage Recipes</a>
    </div>
  </nav>

  <!-- ─── Header ─────────────────────────────────────────────── -->
  <header class="site-header">
    <div class="container">
      <h1>Your <span class="accent-orange">Kitchen</span></h1>
      <p class="tagline">Time to cook! Tap a meal to view ingredients and instructions.</p>
    </div>
  </header>

  <main class="container">
    <div id="empty-state" style="text-align:center; padding: 60px 20px; display:none;">
      <div style="font-size:4rem; margin-bottom:1rem;">🍽️</div>
      <h2 style="margin-bottom:1rem;">Your kitchen is empty</h2>
      <p style="color:var(--text-light); margin-bottom:2rem;">You haven't sent any meals to the kitchen yet.</p>
      <a href="/" class="btn btn-primary" style="display:inline-block; text-decoration:none;">Go Pick Meals</a>
    </div>

    <section id="kitchen-section" style="display:none;">
      <div class="recipes-grid" id="kitchen-grid">
        <!-- filled by JS -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      Made with 🍳 — <em>What Should We Eat?</em>
    </div>
  </footer>

  <!-- ─── Recipe Modal ───────────────────────────────────────── -->
  <div class="modal-overlay" id="meal-modal" style="display:none;">
    <div class="modal modal-lg" style="padding:0; overflow-y:auto;">
      <!-- Sticky header -->
      <div style="position:sticky; top:0; background:var(--bg-card); padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; z-index:10;">
        <h2 id="modal-title" style="margin:0; font-family:var(--font-heading); font-size:2rem; padding-right:20px; color:var(--text-dark);">Recipe Title</h2>
        <button class="btn btn-icon" id="btn-close-modal" style="font-size:1.5rem;">✕</button>
      </div>
      
      <!-- Content body -->
      <div style="padding:20px;">
        <div class="recipe-card-meta" id="modal-meta" style="margin-bottom:24px;"></div>
        
        <div style="display:grid; grid-template-columns: 1fr; gap:32px;">
          <!-- Ingredients -->
          <div>
            <h3 style="color:var(--green-dark); margin-bottom:16px; border-bottom:2px solid var(--green-pale); padding-bottom:8px;">Ingredients</h3>
            <ul id="modal-ingredients" style="list-style:none; padding:0; display:flex; flex-direction:column; gap:12px; font-size:1.1rem;">
              <!-- JS -->
            </ul>
          </div>

          <!-- Instructions -->
          <div>
            <h3 style="color:var(--orange-dark); margin-bottom:16px; border-bottom:2px solid var(--orange-pale); padding-bottom:8px;">Instructions</h3>
            <div id="modal-instructions" style="display:flex; flex-direction:column; gap:20px;">
              <!-- JS -->
            </div>
          </div>
        </div>
      </div>

      <!-- Sticky footer -->
      <div style="position:sticky; bottom:0; background:var(--bg-card); padding:20px; border-top:1px solid var(--border); display:flex; justify-content:center; box-shadow:0 -4px 10px rgba(0,0,0,0.05); z-index:10;">
        <button class="btn btn-primary" id="btn-toggle-cooked" style="font-size:1.2rem; padding:16px 32px; width:100%; max-width:400px;">
          <!-- JS text -->
        </button>
      </div>
    </div>
  </div>

  <script src="/kitchen.js"></script>
</body>
</html>
