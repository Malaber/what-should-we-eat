{% extends "sqladmin/base.html" %}
{% block body %}
<header class="navbar navbar-dark px-3 py-2">
  <a class="navbar-brand" href="{{ url_for('admin:index') }}">{{ admin.title }}</a>
  <nav aria-label="Administration" class="d-flex gap-3">
    <a href="{{ url_for('admin:list', identity='user') }}">Accounts</a>
    <a href="{{ url_for('admin:list', identity='passkey-add-link') }}">Passkey links</a>
    <a href="/auth/account">Account settings</a>
  </nav>
</header>
<main class="container-fluid py-4">
  {% block content_header %}<h1>{{ title }}</h1>{% endblock %}
  {% block content %}{% endblock %}
</main>
{% endblock %}
